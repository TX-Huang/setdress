[project]
name = "setdress-web-build"
version = "0.1.0"
description = "Build the website folder (_site) from a whitelist of prototype files."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "N", "RUF"]
# 註解、說明和錯誤訊息用繁體中文寫，全形標點是中文的正確寫法，不是打錯的字元。
allowed-confusables = ["：", "，", "；", "（", "）"]

[tool.ruff.lint.mccabe]
max-complexity = 6
