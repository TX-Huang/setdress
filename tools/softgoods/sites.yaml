# 站台清單。加一個網站就加一塊。
#
# 加之前先跑：  python check_site.py <網址>
# 紅燈就不要加。黃燈就把 crawl_delay_sec 調大。
#
# platform 是 shopify / shopline / cyberbiz / woocommerce 的話，
# 通常有公開 JSON，用 adapter: shopify 就好，不用寫程式。

sites:
  - site_id: lampclub
    name: 燈迷俱樂部
    base_url: https://lampclub.tw
    adapter: lampclub
    kind: aggregator
    platform: custom
    crawl_delay_sec: 1.5
    notes: >
      聚合站，自己不賣東西，列出每盞燈在台灣哪裡買得到。
      技術上：robots Allow /、有 sitemap（2142 盞）、純 HTML。
      條款上：使用條款寫「請勿以程式大量擷取本站資料」，所以 check_site
      判紅燈。Isaac 2026-11-20 來信詢問，對方回覆同意，才抓的整站。
      公開發布也問過了：2026-11-20 Isaac 再問 lampclub，對方同意公開。資料目前還在私人 repo，搬進公開 repo 是另一步。

  - site_id: luxurylife
    name: 潤舍 Luxury Life
    base_url: https://www.luxurylife.com.tw
    adapter: shopify
    kind: dealer
    platform: shopify
    crawl_delay_sec: 2.0
    size_from_page: true
    notes: >
      Shopify 店，/products.json 可用（已實測）。
      尺寸不在 products.json，在商品頁「商品資訊」那一塊（Shopify metafield），
      所以打開 size_from_page：分得出類別、清單裡沒尺寸的商品，一件多開一頁（約 1050 頁）。
      Flos / Tom Dixon 等品牌的台灣通路。
      check_site 2026-11-20：條款找到了、沒禁止。

  - site_id: nosa
    name: NOSA
    base_url: https://www.nosa.tw
    adapter: shopify
    kind: dealer
    platform: shopify
    crawl_delay_sec: 2.0
    notes: >
      Shopify 店。check_site 2026-11-20：條款找到了、沒禁止。

  - site_id: jytdesign
    name: 居雅堂
    base_url: https://www.jytdesign.com.tw
    adapter: shopify
    kind: dealer
    platform: shopify
    crawl_delay_sec: 2.0
    notes: >
      Shopify 店。check_site 2026-11-20：條款找到了、沒禁止。

  - site_id: sheeper
    name: Sheeper
    base_url: https://www.sheeper.com.tw
    adapter: shopify
    kind: dealer
    platform: shopify
    crawl_delay_sec: 2.0
    notes: >
      Shopify 店。check_site 2026-11-20：條款找到了、沒禁止。

