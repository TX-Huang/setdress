    kind: dealer
    platform: custom
    crawl_delay_sec: 2.0
    notes: >
      自架（Laravel）。Isaac 2026-11-20 問過店家，同意（條款有很廣的智慧財產權條文）。
      robots.txt 全部允許、沒寫 Crawl-delay；sitemap 有 4115 個 /product/ 頁；
      商品頁有 schema.org Product（價格、供貨），尺寸寫在頁面文字。

  - site_id: loft29
