    adapter: schemaorg
    product_url_pattern: /w/product/detail/\d+$
    kind: dealer
    platform: custom
    crawl_delay_sec: 2.0
    notes: >
      自架（Vue 前台，資料從 /api/ 來，但 robots.txt 禁止 /api/）。人工看條款 2026-11-20：沒有禁止。
      伺服器給的商品頁只有 schema.org Product（品名、品牌、SKU、價格、供貨）、麵包屑，
      沒有尺寸。「歡迎來電洽詢」的商品沒有價格。

