# 網站的分類名 → 我們的 (cat1, cat2)
#
# 這張表只能人工建，沒有自動化的辦法 —— 但建一次就一直能用。
# 對不到的會回 (None, None)，所以你查得出「還有哪些分類沒對應」：
#   SELECT DISTINCT title_raw FROM listing l JOIN variant v ... WHERE product.cat2 IS NULL
#
# 分類代號對應 taxonomy.yaml。

